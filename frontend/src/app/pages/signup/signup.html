<section class="signup-page" aria-labelledby="signup-title">
  <div class="signup-intro">
    <span class="signup-mark" aria-hidden="true">✦</span>
    <p class="eyebrow">WELCOME TO AI COMPASS</p>
    <h1 id="signup-title">Create your account</h1>
    <p class="intro-copy">Join AI Compass and personalize your AI tool discovery experience.</p>
  </div>

  <div class="signup-card">
    <div class="card-heading">
      <h2>Get started</h2>
      <p>Create an account to make your discovery experience yours.</p>
    </div>

    <div class="form-fields">
      <div class="form-field">
        <label for="full-name">Full Name</label>
        <input id="full-name" type="text" autocomplete="name" placeholder="Your full name" />
      </div>
      <div class="form-field">
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="form-field">
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" autocomplete="new-password" placeholder="Create a password" />
      </div>
      <div class="form-field">
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Enter your password again" />
      </div>
      <button class="signup-button" type="button">Create Account</button>
    </div>

    <p class="login-prompt">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</section>
