<section class="login-page" aria-labelledby="login-title">
  <div class="login-intro">
    <span class="login-mark" aria-hidden="true">✦</span>
    <p class="eyebrow">WELCOME TO AI COMPASS</p>
    <h1 id="login-title">Login</h1>
    <p class="intro-copy">Sign in to personalize your AI Compass experience.</p>
  </div>

  <div class="login-card">
    <div class="card-heading">
      <h2>Welcome back</h2>
      <p>Enter your details to continue.</p>
    </div>

    <div class="form-fields">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
      </div>
      <button class="login-button" type="button">Login</button>
    </div>

    <p class="signup-prompt">Don't have an account? <a class="signup-link" routerLink="/signup">Create one</a></p>
    <p class="login-note">Account access is coming soon.</p>
  </div>
</section>
